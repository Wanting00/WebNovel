# WebNovel 网关：80 端口跳转 HTTPS，443 端口终止 TLS 并反代到 Streamlit
user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    upstream streamlit {
        server web:8501;
    }

    # HTTP -> HTTPS 跳转
    server {
        listen 80;
        server_name lalabots.com www.lalabots.com _;
        return 301 https://$host$request_uri;
    }

    # HTTPS 入口（自签名证书）
    server {
        listen 443 ssl;
        server_name lalabots.com www.lalabots.com;

        ssl_certificate     /etc/nginx/certs/lalabots.com.crt;
        ssl_certificate_key /etc/nginx/certs/lalabots.com.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # 上传 TXT 样本（与 MAX_UPLOAD_MB=10 对应，留点余量）
        client_max_body_size 20m;

        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;

            # Streamlit 依赖 WebSocket，必须转发 Upgrade 头
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 生成类请求耗时较长，放宽超时
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
